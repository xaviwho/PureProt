##
## PureProtX 5-Validator PoA² Consortium Network
##
## 3 active authority validators + 2 standby validators + 1 pureprot-node
##
## Implements the gap condition (Eq. 8) for standby promotion when a
## validator fails. All validators share the poa_net bridge network.
##
## Usage:
##   docker-compose -f docker/docker-compose.validators.yml up -d
##

# docker-compose.validators.yml

x-validator-common: &validator-common
  image: trufflesuite/ganache:latest
  networks:
    - poa_net
  restart: unless-stopped

services:
  # ------------------------------------------------------------------
  # Active Authority Validators (3)
  # ------------------------------------------------------------------
  validator-1:
    <<: *validator-common
    container_name: pureprot-validator-1
    command: >
      --chain.chainId 900520900520
      --miner.blockGasLimit 8000000
      --server.host 0.0.0.0
      --server.port 8545
      --wallet.deterministic true
      --wallet.totalAccounts 5
      --database.dbPath /data
    ports:
      - "8545:8545"
    volumes:
      - validator1-data:/data
    environment:
      - NODE_ROLE=active
      - VALIDATOR_KEY=validator_1_key
      - RELIABILITY_WINDOW=50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  validator-2:
    <<: *validator-common
    container_name: pureprot-validator-2
    command: >
      --chain.chainId 900520900520
      --miner.blockGasLimit 8000000
      --server.host 0.0.0.0
      --server.port 8545
      --wallet.deterministic true
      --wallet.totalAccounts 5
      --database.dbPath /data
    ports:
      - "8546:8545"
    volumes:
      - validator2-data:/data
    environment:
      - NODE_ROLE=active
      - VALIDATOR_KEY=validator_2_key
      - RELIABILITY_WINDOW=50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  validator-3:
    <<: *validator-common
    container_name: pureprot-validator-3
    command: >
      --chain.chainId 900520900520
      --miner.blockGasLimit 8000000
      --server.host 0.0.0.0
      --server.port 8545
      --wallet.deterministic true
      --wallet.totalAccounts 5
      --database.dbPath /data
    ports:
      - "8547:8545"
    volumes:
      - validator3-data:/data
    environment:
      - NODE_ROLE=active
      - VALIDATOR_KEY=validator_3_key
      - RELIABILITY_WINDOW=50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Standby Validators (2)
  # ------------------------------------------------------------------
  standby-1:
    <<: *validator-common
    container_name: pureprot-standby-1
    command: >
      --chain.chainId 900520900520
      --miner.blockGasLimit 8000000
      --server.host 0.0.0.0
      --server.port 8545
      --wallet.deterministic true
      --wallet.totalAccounts 5
      --database.dbPath /data
    ports:
      - "8548:8545"
    volumes:
      - standby1-data:/data
    environment:
      - NODE_ROLE=standby
      - VALIDATOR_KEY=standby_1_key
      - RELIABILITY_WINDOW=50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  standby-2:
    <<: *validator-common
    container_name: pureprot-standby-2
    command: >
      --chain.chainId 900520900520
      --miner.blockGasLimit 8000000
      --server.host 0.0.0.0
      --server.port 8545
      --wallet.deterministic true
      --wallet.totalAccounts 5
      --database.dbPath /data
    ports:
      - "8549:8545"
    volumes:
      - standby2-data:/data
    environment:
      - NODE_ROLE=standby
      - VALIDATOR_KEY=standby_2_key
      - RELIABILITY_WINDOW=50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PureProtX application node is run from the host machine using
  # blockchain/failure_test.py, connecting to validator-1:8545 via
  # the published ports (localhost:8545-8549).

networks:
  poa_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  standby1-data:
  standby2-data:
