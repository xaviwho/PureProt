name: PureProtX Enhanced E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nodejs npm
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Install and start Ganache CLI
      run: |
        npm install -g ganache-cli
        ganache-cli --deterministic --accounts 10 --host 0.0.0.0 --port 8545 &
        sleep 10
    
    - name: Verify Ganache is running
      run: |
        curl -X POST -H "Content-Type: application/json" \
             --data '{"jsonrpc":"2.0","method":"eth_accounts","params":[],"id":1}' \
             http://localhost:8545
    
    - name: Run Enhanced E2E Tests
      env:
        TEST_PRIVATE_KEY: "0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d"
      run: |
        python tests/enhanced_e2e_test.py
    
    - name: Verify test artifacts
      run: |
        ls -la tests/
        if [ -f "pureprot_results.json" ]; then
          echo "✓ Results file created"
          cat pureprot_results.json
        fi
        if [ -f "tests/verification_log.txt" ]; then
          echo "✓ Verification log created"
          tail -20 tests/verification_log.txt
        fi
        if [ -f "tests/docking_scores.csv" ]; then
          echo "✓ Docking scores created"
          head -5 tests/docking_scores.csv
        fi
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          pureprot_results.json
          tests/verification_log.txt
          tests/docking_scores.csv
          tests/golden/
        retention-days: 30
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-python-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run integration tests with real data
      run: |
        # Test with actual ChEMBL data (small subset)
        python PureProt.py info
        echo "✓ CLI info command works"
        
        # Test data fetching (if API available)
        python PureProt.py fetch-data "CHEMBL243" --output "test_hiv_data.csv" || echo "ChEMBL API not available in CI"
        
        # Test model training on existing data
        if [ -f "chembl243_prepared_data.csv" ]; then
          python PureProt.py train-model "chembl243_prepared_data.csv" --output "test_consensus_model.joblib"
          echo "✓ Consensus AI training works"
        fi
    
    - name: Validate CLI completeness
      run: |
        # Test all CLI commands for help text
        python PureProt.py --help
        python PureProt.py info
        python PureProt.py connect --help
        python PureProt.py screen --help
        python PureProt.py train-model --help
        python PureProt.py fetch-data --help
        echo "✓ All CLI commands have proper help text"
